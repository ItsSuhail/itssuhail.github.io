<title>Rnote Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar on top, canvas fills the rest, minimap and readout float over the canvas corners. */
:root {
  --ground: #e6e9ee;
  --panel: #f6f7f9;
  --ink: #1b2027;
  --ink-2: #5b6672;
  --line: #ccd2da;
  --accent: #2c6bd6;
  --accent-ink: #ffffff;
  --warn: #8f5200;
  --warn-bg: #fbf0dc;
  --shadow: 0 1px 2px rgba(20, 30, 45, .12), 0 6px 20px rgba(20, 30, 45, .10);
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #13161a; --panel: #1c2026; --ink: #e5e8ec; --ink-2: #97a1ad; --line: #323941;
    --accent: #6ea3ff; --accent-ink: #0b1220; --warn: #e3ad55; --warn-bg: #2d2515;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #13161a; --panel: #1c2026; --ink: #e5e8ec; --ink-2: #97a1ad; --line: #323941;
  --accent: #6ea3ff; --accent-ink: #0b1220; --warn: #e3ad55; --warn-bg: #2d2515;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui);
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.mark { flex: none; color: var(--accent); display: grid; }
.title { display: flex; flex-direction: column; min-width: 0; }
.title strong { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title span { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; line-height: 1.2;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.zoom { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.zoom .btn { border: 0; border-radius: 0; border-right: 1px solid var(--line); min-width: 34px; }
.zoom .btn:last-child { border-right: 0; }
#zval { font-family: var(--font-num); font-size: 12px; min-width: 58px; font-variant-numeric: tabular-nums; }

.tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }
#stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--ground); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline-offset: -3px; }
#cv.dragging { cursor: grabbing; }

.hud {
  position: absolute; bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px;
  font-size: 12px; color: var(--ink-2); box-shadow: var(--shadow); max-width: calc(100% - 220px); pointer-events: none;
}
.gridbtn { pointer-events: auto; padding: 3px 9px; font-size: 12px; }
.gridbtn[aria-pressed="false"] { color: var(--ink-2); }
.hud .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }
#mini {
  position: absolute; bottom: 12px; right: max(16px, env(safe-area-inset-right, 0px));
  border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); background: var(--panel);
  touch-action: none; cursor: crosshair;
}
.notice {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: min(560px, calc(100% - 32px)); box-sizing: border-box;
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
  padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: var(--shadow);
}
.notice p { margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.notice button { appearance: none; background: none; border: 0; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
#dropmask {
  position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 10px;
  background: color-mix(in srgb, var(--panel) 82%, transparent);
  display: grid; place-items: center; font-weight: 600; font-size: 16px; pointer-events: none;
}
@media (max-width: 520px) { .hud { max-width: calc(100% - 150px); } }
</style>

<header class="bar">

      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22l1.2-5L17.5 4.7a2.1 2.1 0 013 3L8.2 19.8 4 22z"/><path d="M15 7.2l3.8 3.8"/><path d="M13 22h9"/></svg>
    </span>

  </div>
  <div class="actions">

      <button class="btn" id="tBox" type="button" aria-pressed="false" title="Box select (B)">Box select</button>

    <div class="zoom" role="group" aria-label="Zoom">

      <button class="btn" id="fit" type="button">Fit</button>
    </div>
  </div>
</header>

<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="Rnote canvas. Drag to pan, scroll or pinch to zoom, press F to fit."></canvas>
  <div class="notice" id="notice" role="status" hidden><p id="noticeText"></p><button type="button" id="noticeX" aria-label="Dismiss">×</button></div>
  <div class="hud" id="hud"><button class="btn gridbtn" id="gridBtn" type="button" aria-pressed="true">Grid: on</button><span>x <span class="num" id="cx">0</span></span><span>y <span class="num" id="cy">0</span></span><span id="hint">Drag to pan · scroll or pinch to zoom</span></div>
  <canvas id="mini" width="168" height="112" style="width:168px;height:112px" aria-label="Overview map"></canvas>
  <div id="dropmask" hidden>Drop a .rnote file to open it</div>
</main>
<input type="file" id="file" hidden>

<script>
//#CORE-START
const Core = (() => {
  const num = (v, d = 0) => (typeof v === 'number' && Number.isFinite(v)) ? v : d;

  /* slotmap -> plain array, keeping index alignment (null for empty slots) */
  function unslot(x) {
    if (!x) return [];
    const arr = Array.isArray(x) ? x : (typeof x === 'object' ? Object.values(x) : []);
    return arr.map(e => (e && typeof e === 'object' && !Array.isArray(e) && 'value' in e && Object.keys(e).length <= 2) ? e.value : e);
  }
  function pt(p) {
    if (Array.isArray(p)) return [num(p[0]), num(p[1])];
    if (p && typeof p === 'object') {
      if ('x' in p) return [num(p.x), num(p.y)];
      if ('pos' in p) return pt(p.pos);
      if (Array.isArray(p.data)) return pt(p.data);
    }
    return [0, 0];
  }
  /* serde external tag: {"lineto": {...}} -> ['lineto', {...}] */
  function tagged(o) {
    if (typeof o === 'string') return [o.toLowerCase().replace(/_/g, ''), null];
    if (o && typeof o === 'object' && !Array.isArray(o)) {
      const k = Object.keys(o);
      if (k.length === 1) return [k[0].toLowerCase().replace(/_/g, ''), o[k[0]]];
    }
    return [null, o];
  }
  function color(c) {
    if (c == null) return null;
    let r, g, b, a = 1;
    if (Array.isArray(c)) { [r, g, b, a = 1] = c; }
    else if (typeof c === 'object') { if (c.color) return color(c.color); ({ r, g, b, a = 1 } = c); }
    else return null;
    if (![r, g, b].every(Number.isFinite)) return null;
    const big = Math.max(r, g, b) > 1;
    const s = big ? 1 : 255;
    const al = big ? (a > 1 ? a / 255 : a) : a;
    return { css: `rgba(${Math.round(r * s)},${Math.round(g * s)},${Math.round(b * s)},${+al.toFixed(3)})`, a: al };
  }
  function affine(t) {
    let m = t && (t.affine !== undefined ? t.affine : t);
    if (m && !Array.isArray(m) && m.matrix) m = m.matrix;
    if (Array.isArray(m)) {
      if (m.length === 9) return [m[0], m[1], m[3], m[4], m[6], m[7]];
      if (m.length === 16) return [m[0], m[1], m[4], m[5], m[12], m[13]];
      if (m.length === 6) return m.slice();
    }
    return [1, 0, 0, 1, 0, 0];
  }
  const apply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  function halfExt(rect) {
    const h = rect && ((rect.cuboid && rect.cuboid.half_extents) || rect.half_extents);
    return pt(h || [0, 0]);
  }
  function boundsOf(points, pad = 0) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of points) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    if (!Number.isFinite(x0)) return [0, 0, 0, 0];
    return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
  }

  function styleOf(s) {
    const [k, o] = tagged(s);
    const opts = (o && typeof o === 'object') ? o : (s && typeof s === 'object' ? s : {});
    let curve = opts.pressure_curve;
    if (curve && typeof curve === 'object') curve = Object.keys(curve)[0];
    return {
      kind: k || 'smooth',
      width: num(opts.stroke_width !== undefined ? opts.stroke_width : opts.width, 2),
      stroke: color(opts.stroke_color !== undefined ? opts.stroke_color : opts.color),
      fill: color(opts.fill_color),
      curve: typeof curve === 'string' ? curve.toLowerCase() : 'const',

  /* ---- pen paths ---- */
  function el(e) {
    if (!e) return { x: 0, y: 0, p: 0.5 };
    const q = pt(e.pos !== undefined ? e.pos : e);

  function flattenPath(path) {
    const out = [];

    if (Array.isArray(path)) { for (const e of path) out.push(el(e)); return out; }

    out.push(cur);
    const segs = path.seg || path.segments || path.segs || [];
    const seglist = Array.isArray(segs) ? segs : Object.values(segs);

      const [k, v] = tagged(s);
      if (!v) continue;
      if (k === 'lineto') {
        cur = el(v.end !== undefined ? v.end : v); out.push(cur);
      } else if (k === 'quadbezto' || k === 'cubbezto' || k === 'cubicbezto') {
        const end = el(v.end);
        const cps = k === 'quadbezto' ? [pt(v.cp)] : [pt(v.cp1), pt(v.cp2)];
        const chord = Math.hypot(end.x - cur.x, end.y - cur.y);
        const n = Math.max(3, Math.min(20, Math.ceil(chord / 4)));
        for (let i = 1; i <= n; i++) {
          const t = i / n, u = 1 - t;
          let x, y;
          if (cps.length === 1) {
            x = u * u * cur.x + 2 * u * t * cps[0][0] + t * t * end.x;
            y = u * u * cur.y + 2 * u * t * cps[0][1] + t * t * end.y;
          } else {
            x = u * u * u * cur.x + 3 * u * u * t * cps[0][0] + 3 * u * t * t * cps[1][0] + t * t * t * end.x;
            y = u * u * u * cur.y + 3 * u * u * t * cps[0][1] + 3 * u * t * t * cps[1][1] + t * t * t * end.y;
          }
          out.push({ x, y, p: cur.p + (end.p - cur.p) * t });
        }
        cur = end;
      }
    }
    return out;
  }

  /* ---- strokes ---- */
  function parseBrush(v) {
    const pts = flattenPath(v.path);
    const st = styleOf(v.style);
    const b = boundsOf(pts.map(p => [p.x, p.y]), st.width * 1.6 + 1);
    return {
      type: 'brush', xs: pts.map(p => p.x), ys: pts.map(p => p.y), ps: pts.map(p => p.p),
      color: (st.stroke || { css: 'rgb(0,0,0)' }).css, alpha: st.stroke ? st.stroke.a : 1,
      width: st.width, curve: st.curve, b,
    };
  }
  function parseShape(v) {
    const st = styleOf(v.style);
    const [k, s] = tagged(v.shape);
    if (!s || typeof s !== 'object') return { type: 'unsupported', kind: 'shape:' + (k || 'unknown') };

    const m0 = [1, 0, 0, 1, 0, 0];
    if (k === 'line') { shape = { kind: 'line', a: pt(s.start), b: pt(s.end) }; pts = [shape.a, shape.b]; }
    else if (k === 'arrow') { shape = { kind: 'arrow', a: pt(s.start), b: pt(s.tip !== undefined ? s.tip : s.end) }; pts = [shape.a, shape.b]; }
    else if (k === 'quadbez' || k === 'quadraticbezier') { shape = { kind: 'quad', a: pt(s.start), c: pt(s.cp), b: pt(s.end) }; pts = [shape.a, shape.c, shape.b]; }

      const list = [pt(s.start)];

        const [tk, tv] = tagged(e);

      shape = { kind: k, pts: list }; pts = list;
    }

      pts = [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]].map(([x, y]) => apply(m, x, y));
    }
    else return { type: 'unsupported', kind: 'shape:' + k };
    const hasAny = st.stroke || st.fill;
    return {
      type: 'shape', shape, stroke: hasAny ? (st.stroke ? st.stroke.css : null) : 'rgb(0,0,0)',
      fill: st.fill ? st.fill.css : null, width: st.width, b: boundsOf(pts, st.width * 1.2 + 1),
    };
  }
  function parseText(v) {
    const ts = v.text_style || {};
    const m = affine(v.transform);
    const size = num(ts.font_size, 32);
    const text = typeof v.text === 'string' ? v.text : '';

    const lines = text.split('\n');
    const w = maxW > 0 ? maxW : Math.max(1, ...lines.map(l => l.length)) * size * 0.55;
    let nl = 0;
    for (const l of lines) nl += maxW > 0 ? Math.max(1, Math.ceil(l.length * size * 0.55 / maxW)) : 1;
    const h = nl * size * 1.25;
    const b = boundsOf([[0, 0], [w, 0], [w, h], [0, h]].map(([x, y]) => apply(m, x, y)), 2);
    const fs = String(ts.font_style || '').toLowerCase();
    return {
      type: 'text', text, m, size, family: String(ts.font_family || 'serif'),
      weight: num(ts.font_weight, 400), italic: fs.includes('italic') || fs.includes('oblique'),
      color: (color(ts.color) || { css: 'rgb(0,0,0)' }).css, maxW, align: String(ts.alignment || 'start').toLowerCase(), b,
    };
  }
  function b64(s) {
    if (typeof Uint8Array.fromBase64 === 'function') return Uint8Array.fromBase64(s);
    const bin = atob(s); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function parseImage(v, bitmap) {
    const img = v.image || {};
    const rect = v.rectangle || img.rect || v.rect || {};

    const [hx, hy] = halfExt(rect);

    const [k, v] = tagged(raw);

    if (k === 'shapestroke') return parseShape(v);
    if (k === 'textstroke') return parseText(v);
    if (k === 'bitmapimage') return parseImage(v, true);
    if (k === 'vectorimage') return parseImage(v, false);
    return { type: 'unsupported', kind: k || 'unknown' };
  }

  function parseDoc(d) {
    d = d || {};
    const cfg = d.config || d;
    const fmt = cfg.format || d.format || {};
    const bg = cfg.background || d.background || {};
    const layout = String(cfg.layout !== undefined ? cfg.layout : (d.layout !== undefined ? d.layout : '')).toLowerCase();
    const pc = color(bg.pattern_color);
    return {
      x: num(d.x), y: num(d.y), w: num(d.width), h: num(d.height),
      pageW: num(fmt.width, 794), pageH: num(fmt.height, 1123),
      bg: color(bg.color) || { css: 'rgb(255,255,255)', a: 1 },

  }
  function parseObject(root) {
    const snap = findSnapshot(root);
    if (!snap) throw new Error('No drawing data found. This does not look like an Rnote document.');
    const strokes = unslot(snap.stroke_components);
    const chrono = unslot(snap.chrono_components);
    const aligned = chrono.length === strokes.length;
    const items = [], unsupported = {};

      if (!raw) return;

      it.t = (c && typeof c === 'object' && typeof c.t === 'number') ? c.t : i;
      it.i = i;

      ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      if (drag.type === 'box') {
        const x = Math.min(drag.start.x, drag.cur.x), y = Math.min(drag.start.y, drag.cur.y), w = Math.abs(drag.cur.x - drag.start.x), h = Math.abs(drag.cur.y - drag.start.y);
        ctx.globalAlpha = 0.1; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1; ctx.strokeRect(x, y, w, h);
      } else {
        ctx.beginPath(); drag.pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath();
        ctx.globalAlpha = 0.1; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
      }
    }
    ctx.restore();
  }

  let coordPending = null;
  function setCoords(p) {
    if (coordPending) { coordPending = p; return; }
    coordPending = p;
    requestAnimationFrame(() => { const q = coordPending; coordPending = null; $('#cx').textContent = fmt((q.x - cam.tx) / cam.k); $('#cy').textContent = fmt((q.y - cam.ty) / cam.k); });
  }
  $('#zin').onclick = () => zoomAt(W / 2, H / 2, 1.25);
  $('#zout').onclick = () => zoomAt(W / 2, H / 2, 0.8);
  $('#zval').onclick = () => zoomAt(W / 2, H / 2, 1 / cam.k);
  $('#fit').onclick = fitAll;

  /* ---------- loading ---------- */
  function showNotice(msg) { $('#noticeText').textContent = msg; $('#notice').hidden = !msg; }
  $('#noticeX').onclick = () => showNotice('');
  function setModel(m, name, extra) {
    model = m; sel = []; undoStack = []; drag = null;
    for (const it of m.items) { it.b0 = it.b.slice(); it.tf = null; }
    $('#fname').textContent = name;
    const w = m.bounds[2] - m.bounds[0], h = m.bounds[3] - m.bounds[1];
    $('#fmeta').textContent = [`${m.items.length.toLocaleString('en-US')} elements`, `${fmt(w)} × ${fmt(h)} px`, m.version ? `format ${m.version}` : '', extra].filter(Boolean).join(' · ');
    const un = Object.entries(m.unsupported);
    showNotice(un.length ? 'Not drawn: ' + un.map(([k, v]) => `${v} × ${k}`).join(', ') + '.' : (m.items.length ? '' : 'This file has no drawable elements.'));
    buildMini(); initialView(); updateTools();
  }
  async function loadFile(file) {
    $('#fmeta').textContent = 'Reading ' + file.name + '…';
    try {
      const m = await Core.parseFile(file, n => { $('#fmeta').textContent = `Reading ${file.name}… ${n.toLocaleString('en-US')} elements`; });
      setModel(m, file.name, 'read locally');
    } catch (err) {
      showNotice(err && err.message ? err.message : 'Could not open this file.');
      $('#fmeta').textContent = model ? 'Previous file still shown' : 'No file open';
    }
  }
  $('#open').onclick = () => $('#file').click();
  $('#file').onchange = e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; };
  let dragN = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#dropmask').hidden = false; });
  addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('#dropmask').hidden = true; });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dropmask').hidden = true; const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });

  function resize() {
    const r = stage.getBoundingClientRect(); const first = !W;
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height)); dpr = Math.min(devicePixelRatio || 1, 3);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (first && model) initialView(); else requestRender();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  refreshTheme();
  setModel(Core.parse(JSON.stringify(Core.sampleSnapshot())), 'Sample note (built in)', 'open your own file above');
})();
</script>

</body></html>
